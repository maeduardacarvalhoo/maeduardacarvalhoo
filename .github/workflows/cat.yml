name: Generate Cat

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Create animated cat
        shell: bash
        run: |
          mkdir -p dist

          cat > dist/hacker-cat.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg"
               width="800" height="250" viewBox="0 0 800 250">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#050816"/>
                <stop offset="100%" stop-color="#164e63"/>
              </linearGradient>
              <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#22d3ee"/>
                <stop offset="100%" stop-color="#a78bfa"/>
              </linearGradient>
              <filter id="glow">
                <feGaussianBlur stdDeviation="3" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>

            <rect width="800" height="250" rx="18" fill="url(#bg)"/>
            <g stroke="#22d3ee" opacity=".12">
              <path d="M0 40H800 M0 80H800 M0 120H800 M0 160H800 M0 200H800"/>
              <path d="M40 0V250 M80 0V250 M120 0V250 M160 0V250 M200 0V250"/>
            </g>

            <g fill="#22d3ee" font-family="monospace" font-size="12" opacity=".65">
              <text x="28" y="30">CYBER DEFENSE</text>
              <text x="600" y="30">AGENT: CAT-01</text>
              <text x="28" y="225">root@mcarvalho:~$ monitoring_system</text>
            </g>

            <g transform="translate(390 120)">
              <path d="M-46 42 C-100 70 -94 5 -64 14"
                    fill="none" stroke="url(#neon)" stroke-width="8"
                    stroke-linecap="round" filter="url(#glow)">
                <animate attributeName="d"
                  values="M-46 42 C-100 70 -94 5 -64 14;M-46 42 C-80 88 -110 25 -64 14;M-46 42 C-100 70 -94 5 -64 14"
                  dur="2s" repeatCount="indefinite"/>
              </path>

              <path d="M-54 -30 L-47 -75 L-13 -49
                       Q0 -54 13 -49 L47 -75 L54 -30
                       Q72 0 53 34 Q0 72 -53 34 Z"
                    fill="#111827" stroke="url(#neon)"
                    stroke-width="3" filter="url(#glow)"/>

              <path d="M-43 -48 L-40 -64 L-22 -48 Z"
                    fill="#8b5cf6" opacity=".8"/>
              <path d="M43 -48 L40 -64 L22 -48 Z"
                    fill="#8b5cf6" opacity=".8"/>

              <g fill="#22d3ee" filter="url(#glow)">
                <ellipse cx="-25" cy="-8" rx="11" ry="7">
                  <animate attributeName="ry"
                    values="7;1;7" keyTimes="0;.08;.16"
                    dur="4s" repeatCount="indefinite"/>
                </ellipse>
                <ellipse cx="25" cy="-8" rx="11" ry="7">
                  <animate attributeName="ry"
                    values="7;1;7" keyTimes="0;.08;.16"
                    dur="4s" repeatCount="indefinite"/>
                </ellipse>
              </g>

              <path d="M-5 8 L0 13 L5 8 Z" fill="#f472b6"/>
              <path d="M0 13 Q-9 24 -16 17 M0 13 Q9 24 16 17"
                    fill="none" stroke="#22d3ee" stroke-width="2"
                    stroke-linecap="round"/>

              <path d="M-50 2 L-78 -2 M-49 10 L-77 14
                       M50 2 L78 -2 M49 10 L77 14"
                    stroke="#a78bfa" stroke-width="2"
                    stroke-linecap="round"/>
            </g>

            <g font-family="monospace">
              <text x="500" y="105" fill="#22d3ee" font-size="20"
                    font-weight="bold">HACKER CAT</text>
              <text x="500" y="130" fill="#a78bfa" font-size="12">
                BLUE TEAM COMPANION
              </text>
              <text x="500" y="155" fill="#cbd5e1" font-size="11">
                Status: protecting the system
              </text>
              <text x="500" y="180" fill="#22d3ee" font-size="12">
                <animate attributeName="opacity"
                  values="1;0;1" dur="1.2s"
                  repeatCount="indefinite"/>
                &gt; system secure_</text>
            </g>

            <circle cx="740" cy="205" r="4" fill="#22d3ee">
              <animate attributeName="opacity"
                values="1;.2;1" dur="1.5s"
                repeatCount="indefinite"/>
            </circle>
          </svg>
          SVG

      - name: Publish cat
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          force_orphan: true
